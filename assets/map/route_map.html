<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <script src="leaflet/leaflet.js"></script>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; }
    .leaflet-container { font-family: Tahoma, sans-serif; background: #dbeafe; }
    .leaflet-control-attribution { display: none !important; }
    .marker-pin {
      background: transparent;
      border: none;
    }
    .pin-emoji {
      font-size: 22px;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.95);
    }
    .pin-origin { color: #16a34a; }
    .pin-destination { color: #dc2626; }
    .pin-default { color: #2563eb; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const RUDSAR = [[36.98, 50.12], [37.22, 50.52]];
    const RUDSAR_CENTER = [37.137, 50.288];
    let bridge = null;
    let map = null;
    let markersLayer = null;
    let routeLayer = null;
    let pendingMarkers = '[]';
    let pendingRoute = '[]';

    function pinIcon(role) {
      const cls = role === 'origin' ? 'pin-origin' : role === 'destination' ? 'pin-destination' : 'pin-default';
      return L.divIcon({
        className: 'marker-pin',
        html: '<div class="pin-emoji ' + cls + '">📍</div>',
        iconSize: [24, 24],
        iconAnchor: [12, 22],
        popupAnchor: [0, -22]
      });
    }

    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        attributionControl: false,
        minZoom: 11,
        maxZoom: 17,
        maxBounds: RUDSAR,
        maxBoundsViscosity: 1.0
      }).setView(RUDSAR_CENTER, 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 17,
        minZoom: 11,
        attribution: ''
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
      routeLayer = L.layerGroup().addTo(map);
      map.on('click', function (e) {
        if (bridge && bridge.mapClicked) {
          bridge.mapClicked(e.latlng.lat, e.latlng.lng);
        }
      });
      map.on('contextmenu', function (e) {
        L.DomEvent.preventDefault(e);
        if (bridge && bridge.mapRightClicked) {
          bridge.mapRightClicked(e.latlng.lat, e.latlng.lng);
        }
      });
      setMarkers(pendingMarkers);
      drawRoute(pendingRoute);
      setTimeout(function () { map.invalidateSize(); }, 120);
    }

    function setMarkers(jsonStr) {
      pendingMarkers = jsonStr || '[]';
      if (!markersLayer) return;
      markersLayer.clearLayers();
      const items = JSON.parse(pendingMarkers);
      items.forEach(function (m) {
        const mk = L.marker([m.lat, m.lng], { icon: pinIcon(m.role || null) }).addTo(markersLayer);
        const label = m.label || m.title || '';
        if (label) mk.bindPopup(label);
      });
      if (items.length > 0) {
        const latlngs = items.map(function (m) { return [m.lat, m.lng]; });
        map.fitBounds(latlngs, { padding: [36, 36], maxZoom: 14 });
      }
    }

    function drawRoute(jsonStr) {
      pendingRoute = jsonStr || '[]';
      if (!routeLayer) return;
      routeLayer.clearLayers();
      const pts = JSON.parse(pendingRoute);
      if (pts.length < 2) return;
      const latlngs = pts.map(function (p) { return [p[0], p[1]]; });
      L.polyline(latlngs, { color: '#2563eb', weight: 5, opacity: 0.85 }).addTo(routeLayer);
      map.fitBounds(latlngs, { padding: [40, 40], maxZoom: 14 });
    }

    function clearRoute() {
      pendingRoute = '[]';
      if (routeLayer) routeLayer.clearLayers();
    }

    function notifyReady() {
      if (bridge && bridge.mapReady) bridge.mapReady();
    }

    if (typeof qt !== 'undefined') {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        bridge = channel.objects.bridge;
        initMap();
        notifyReady();
      });
    } else {
      initMap();
    }
  </script>
</body>
</html>
